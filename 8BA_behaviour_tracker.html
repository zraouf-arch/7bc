<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8BA Behaviour Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f6f9;
    color: #1f2937;
  }
  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
  }
  h1 {
    text-align: center;
    margin: 0 0 16px;
    font-size: 38px;
  }
  .reset-row {
    text-align: center;
    margin-bottom: 14px;
  }
  #resetBtn {
    background: #374151;
    color: white;
    border: none;
    border-radius: 9px;
    padding: 11px 18px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .instructions {
    text-align: center;
    font-size: 15px;
    line-height: 1.5;
    max-width: 900px;
    margin: 0 auto 20px;
    color: #4b5563;
  }
  .boards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
  }
  .panel {
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 14px;
    padding: 18px;
    min-height: 500px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .panel h2 {
    margin: 0 0 16px;
    text-align: center;
    font-size: 28px;
  }
  .positive-title { color: #15803d; }
  .negative-title { color: #b91c1c; }

  .list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
    gap: 10px;
  }

  .student {
    border: none;
    border-radius: 10px;
    padding: 12px 10px;
    min-height: 48px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .positive {
    background: #dcfce7;
    color: #166534;
    border: 2px solid #86efac;
  }
  .yellow {
    background: #fef3c7;
    color: #92400e;
    border: 2px solid #facc15;
  }
  .orange {
    background: #ffedd5;
    color: #9a3412;
    border: 2px solid #fb923c;
  }
  .red {
    background: #fee2e2;
    color: #991b1b;
    border: 2px solid #ef4444;
  }
  .concern-card {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .return-btn {
    border: 1px solid #86efac;
    background: #f0fdf4;
    color: #166534;
    border-radius: 8px;
    min-height: 36px;
    font-weight: 700;
    cursor: pointer;
  }
  .legend {
    margin-top: 18px;
    text-align: center;
    font-size: 14px;
    color: #4b5563;
    font-weight: 600;
  }
  @media (max-width: 760px) {
    .wrap { padding: 14px; }
    h1 { font-size: 30px; }
    .boards { grid-template-columns: 1fr; }
    .panel { min-height: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>8BA Behaviour Tracker</h1>

  <div class="reset-row">
    <button id="resetBtn">↻ Reset All Students</button>
  </div>

  <p class="instructions">
    Click a student in 😊 Positive to move them to 🟡 Behaviour Concern.
    Click again: 🟡 Yellow → 🟠 Orange → 🔴 Red.
    Use <strong>Return to Positive</strong> when behaviour improves.
  </p>

  <div class="boards">
    <section class="panel">
      <h2 class="positive-title">😊 Positive</h2>
      <div id="positiveList" class="list"></div>
    </section>

    <section class="panel">
      <h2 class="negative-title">☹️ Behaviour Concern</h2>
      <div id="concernList" class="list"></div>

      <div class="legend">
        🟡 First concern &nbsp; | &nbsp;
        🟠 Second concern &nbsp; | &nbsp;
        🔴 Third concern
      </div>
    </section>
  </div>
</div>

<script>
  const students = [
      "Adam Ilham",
      "Adil Mannan",
      "Ahmed Maavia",
      "Ali Dbouk",
      "Aren Lok",
      "Ayham Bashar",
      "Ayyan Ahmed",
      "Emad Ibrahim",
      "Hani Elmir",
      "Isaac El-Hassan",
      "Jawad C Chaker",
      "Jawad H Hodroj",
      "Joud Saleh",
      "Mehdi Tahir",
      "Mikaeel Salimabadi",
      "Mohamad Saadeddine",
      "Mohid Ali Khan",
      "Noah Zeidan",
      "Rayan Waseem",
      "Riyaan Hafiz",
      "Sahariar Musa",
      "Sulaiman R Rasooli",
      "Tahj Darwich",
      "Taylan Alam",
      "Umit Ozcan"
  ];

  const STORAGE_KEY = "8BA_behaviour_tracker_state_v2";

  function makeDefaultState() {
    const obj = {};
    students.forEach(name => obj[name] = 0);
    return obj;
  }

  let state = makeDefaultState();

  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      students.forEach(name => {
        state[name] = Number.isInteger(parsed[name]) ? parsed[name] : 0;
      });
    }
  } catch (e) {}

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function render() {
    const positiveList = document.getElementById("positiveList");
    const concernList = document.getElementById("concernList");

    positiveList.innerHTML = "";
    concernList.innerHTML = "";

    students.forEach(name => {
      const level = state[name] || 0;

      if (level === 0) {
        const button = document.createElement("button");
        button.className = "student positive";
        button.textContent = name;
        button.title = "Move to Behaviour Concern";
        button.addEventListener("click", () => {
          state[name] = 1;
          saveState();
          render();
        });
        positiveList.appendChild(button);
      } else {
        const card = document.createElement("div");
        card.className = "concern-card";

        const button = document.createElement("button");
        button.className = "student " + (level === 1 ? "yellow" : level === 2 ? "orange" : "red");
        button.textContent = name;

        if (level < 3) {
          button.title = "Click to move to next concern level";
          button.addEventListener("click", () => {
            state[name] = Math.min(3, level + 1);
            saveState();
            render();
          });
        } else {
          button.title = "Third concern";
        }

        const returnBtn = document.createElement("button");
        returnBtn.className = "return-btn";
        returnBtn.textContent = "Return to Positive";
        returnBtn.addEventListener("click", () => {
          state[name] = 0;
          saveState();
          render();
        });

        card.appendChild(button);
        card.appendChild(returnBtn);
        concernList.appendChild(card);
      }
    });
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Reset all students back to Positive?")) {
      state = makeDefaultState();
      saveState();
      render();
    }
  });

  render();
</script>
</body>
</html>
